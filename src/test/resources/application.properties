# Use an in-memory database for tests; production continues to use PostgreSQL from src/main/resources.
spring.datasource.url=jdbc:h2:mem:rest-template-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
app.jwt.secret=test-secret-for-jwt-signing-that-is-at-least-32-bytes
app.jwt.expiration-seconds=3600
